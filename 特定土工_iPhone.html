<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="特定土工">
<title>特定土工</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f0f0; }

  /* ===== ホーム画面 ===== */
  .home-header {
    background: #1a5c9a;
    color: white;
    padding: 16px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .search-box {
    background: white;
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f8f8f8;
  }
  .kanai-group { margin-bottom: 2px; }
  .kanai-header {
    background: #2c7bb6;
    color: white;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .site-item {
    background: white;
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
  }
  .site-item:active { background: #e8f0fa; }
  .site-no {
    background: #1a5c9a;
    color: white;
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 12px;
    font-weight: bold;
    min-width: 50px;
    text-align: center;
    flex-shrink: 0;
  }
  .site-no.shinki { background: #e67e22; }
  .site-name-wrap { flex: 1; }
  .site-name { font-size: 15px; color: #222; }
  .site-kp { font-size: 12px; color: #888; margin-top: 2px; }
  .site-arrow { color: #aaa; font-size: 18px; }

  /* 完了履歴ボタン */
  .history-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 10px 12px 4px;
    background: white;
    border: 2px solid #1a5c9a;
    color: #1a5c9a;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
  }
  .history-btn:active { background: #e8f0fa; }

  /* 履歴モーダル */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 500;
    display: flex; align-items: flex-end;
  }
  .modal-sheet {
    background: white;
    width: 100%;
    max-height: 85vh;
    border-radius: 16px 16px 0 0;
    overflow-y: auto;
    padding: 0 0 32px;
  }
  .modal-header {
    position: sticky; top: 0;
    background: white;
    border-bottom: 1px solid #eee;
    padding: 14px 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 17px; font-weight: bold; color: #1a1a1a; }
  .modal-close {
    background: #eee; border: none; border-radius: 50%;
    width: 30px; height: 30px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .hist-day {
    padding: 10px 16px 4px;
    font-size: 13px; font-weight: bold; color: #1a5c9a;
    border-bottom: 1px solid #e8f0fa;
    background: #f5f8ff;
    display: flex; align-items: center; justify-content: space-between;
  }
  .hist-count { font-size: 12px; color: #555; font-weight: normal; }
  .hist-item {
    padding: 9px 16px 9px 24px;
    border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 8px;
  }
  .hist-no {
    background: #1a5c9a; color: white;
    border-radius: 4px; padding: 2px 7px;
    font-size: 12px; font-weight: bold; flex-shrink: 0;
  }
  .hist-no.shinki { background: #e67e22; }
  .hist-name { font-size: 14px; color: #333; flex: 1; }
  .hist-shots { font-size: 12px; color: #27ae60; flex-shrink: 0; }
  .hist-empty { padding: 24px; text-align: center; color: #aaa; font-size: 14px; }
  /* 完了済み箇所 */
  .site-item.completed { background: #f5f5f5; }
  .site-item.completed .site-name { color: #999; text-decoration: line-through; }
  .site-item.completed .site-no { background: #aaa; }
  .site-item.completed .site-no.shinki { background: #c8a87a; }
  .site-done-badge {
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ===== 撮影画面 ===== */
  #shoot-screen { display: none; }
  .shoot-header {
    background: #1a5c9a;
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .shoot-header-top {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    gap: 10px;
  }
  .back-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .shoot-title {
    flex: 1;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
  }
  .shoot-kanai { font-size: 12px; font-weight: normal; opacity: 0.8; }

  /* 箇所情報パネル */
  .site-info-panel {
    background: #e8f0fa;
    border-bottom: 2px solid #1a5c9a;
    padding: 10px 16px;
  }
  .info-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .info-label { font-size: 11px; color: #555; font-weight: bold; min-width: 46px; flex-shrink: 0; }
  .info-value { font-size: 14px; color: #1a1a1a; font-weight: 500; }
  .info-badge {
    display: inline-block;
    background: #1a5c9a;
    color: white;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 11px;
    margin-left: 6px;
  }
  .info-badge.shinki { background: #e67e22; }

  /* 撮影本体 */
  .shoot-body { padding: 12px; }

  /* ===== 新規モード ===== */
  .shinki-panel {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .shinki-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .counter-big {
    font-size: 56px;
    font-weight: bold;
    color: #e67e22;
    line-height: 1;
    flex-shrink: 0;
    min-width: 64px;
    text-align: center;
  }
  .counter-info { flex: 1; }
  .counter-label { font-size: 13px; color: #888; }
  .counter-next {
    font-size: 12px;
    color: #1a5c9a;
    font-family: monospace;
    background: #f0f4fa;
    padding: 3px 7px;
    border-radius: 4px;
    margin-top: 4px;
    display: inline-block;
  }

  /* サムネイルグリッド（新規・既存共通） */
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-top: 8px;
  }
  .thumb-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 5px;
    overflow: hidden;
    background: #eee;
    cursor: pointer;
  }
  .thumb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.55);
    color: white;
    font-size: 9px;
    font-family: monospace;
    padding: 2px 3px;
    text-align: center;
    line-height: 1.2;
  }
  .thumb-del {
    position: absolute;
    top: 2px; right: 2px;
    background: rgba(192,57,43,0.85);
    color: white;
    border: none;
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  /* 保存待ちオーバーレイ */
  .thumb-pending {
    position: absolute;
    inset: 0;
    background: rgba(231,76,60,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
    padding: 3px;
  }

  /* 撮影ボタン */
  .shoot-btn-big {
    width: 100%;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .shoot-btn-big:active { background: #1e8449; }

  /* 保存確認エリア（撮影直後に出現） */
  .save-confirm-bar {
    background: #fef9e7;
    border: 2px solid #f39c12;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .save-confirm-bar img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .save-confirm-info { flex: 1; }
  .save-confirm-fname {
    font-family: monospace;
    font-size: 13px;
    color: #1a1a1a;
    font-weight: bold;
  }
  .save-confirm-hint { font-size: 11px; color: #888; margin-top: 2px; }
  .save-confirm-btns { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .btn-save {
    background: #2980b9;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-save:active { background: #1f6391; }
  .btn-retake {
    background: #bdc3c7;
    color: #333;
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-retake:active { background: #aaa; }

  .undo-btn {
    width: 100%;
    background: #95a5a6;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .undo-btn:active { background: #7f8c8d; }

  /* ===== 既存モード P番号 ===== */
  .p-section-title {
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin: 10px 0 6px;
    padding-left: 2px;
  }
  .p-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .p-card {
    background: white;
    border: 2px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    transition: border-color 0.15s;
  }
  .p-card.done { border-color: #1a5c9a; }
  .p-card.pano-done { border-color: #8e44ad; }
  .p-card-header {
    padding: 8px 6px 4px;
    text-align: center;
  }
  .p-card.done .p-card-header { background: #1a5c9a; color: white; }
  .p-card.pano-done .p-card-header { background: #8e44ad; color: white; }
  .p-num { font-size: 16px; font-weight: bold; }
  .p-status { font-size: 10px; margin-top: 1px; opacity: 0.85; }
  /* P番号カード内サムネイル */
  .p-thumb {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .p-thumb-empty {
    width: 100%;
    aspect-ratio: 4/3;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 22px;
  }
  .p-pano-btn {
    display: block;
    width: 100%;
    font-size: 11px;
    background: rgba(0,0,0,0.07);
    border: none;
    border-top: 1px solid rgba(0,0,0,0.1);
    color: #555;
    padding: 5px;
    cursor: pointer;
    text-align: center;
  }
  .p-card.done .p-pano-btn,
  .p-card.pano-done .p-pano-btn { color: inherit; background: rgba(255,255,255,0.15); border-top-color: rgba(255,255,255,0.2); }

  .add-p-btn {
    width: 100%;
    background: #ecf0f1;
    border: 2px dashed #bdc3c7;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    color: #7f8c8d;
    cursor: pointer;
    margin-top: 2px;
    margin-bottom: 10px;
  }
  .add-p-btn:active { background: #d5dbdb; }

  /* 完了ボタン */
  .complete-btn {
    width: 100%;
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  .complete-btn:active { background: #a93226; }

  /* トースト */
  .fn-toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-family: monospace;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  .fn-toast.show { opacity: 1; }

  /* ローディング */
  #loading-screen {
    position: fixed; inset: 0;
    background: #1a5c9a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: white; z-index: 9999;
  }
  .loading-title { font-size: 28px; font-weight: bold; letter-spacing: 3px; margin-bottom: 20px; }
  .loading-sub { font-size: 14px; opacity: 0.8; }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ローディング -->
<div id="loading-screen">
  <div class="loading-title">特定土工</div>
  <div class="spinner"></div>
  <div class="loading-sub" id="loading-msg">箇所リストを読み込み中…</div>
</div>

<!-- ホーム画面 -->
<div id="home-screen" style="display:none;">
  <div class="home-header">特定土工</div>
  <div class="search-box">
    <input type="search" id="search-input" placeholder="箇所名・No.で絞り込み" oninput="filterSites()">
  </div>
  <button class="history-btn" onclick="showHistory()">📋　完了履歴を見る</button>
  <div id="site-list"></div>
</div>

<!-- 完了履歴モーダル -->
<div class="modal-overlay" id="history-modal" style="display:none;" onclick="hideHistory(event)">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">📋 完了履歴</span>
      <button class="modal-close" onclick="hideHistory()">✕</button>
    </div>
    <div id="history-body"></div>
  </div>
</div>

<!-- 撮影画面 -->
<div id="shoot-screen" style="display:none;">
  <div class="shoot-header">
    <div class="shoot-header-top">
      <button class="back-btn" onclick="goBack()">◀ 戻る</button>
      <div class="shoot-title">
        <div class="shoot-kanai" id="sh-kanai"></div>
        <div id="sh-no-name"></div>
      </div>
    </div>
    <div class="site-info-panel" id="site-info-panel"></div>
  </div>
  <div class="shoot-body" id="shoot-body"></div>
</div>

<!-- カメラ input -->
<input type="file" accept="image/*" capture="environment" id="camera-input" style="display:none">

<!-- トースト -->
<div class="fn-toast" id="fn-toast"></div>

<script>
const JSON_URL = 'https://raw.githubusercontent.com/bluenilegear/tokuteidoko-tools/main/kasho-list.json';

let allSites = [];
let currentSite = null;
let toastTimer = null;

// ===== 管内略称（ファイル名に使用） =====
function kanaiAbbr(kanai) {
  if (kanai.includes('雪崩')) return '神岡雪崩';
  if (kanai.includes('落石') || kanai.includes('落防')) return '神岡落石';
  if (kanai.includes('神岡')) return '神岡落石'; // 神岡管内のその他
  if (kanai.includes('下呂')) return '下呂';
  if (kanai.includes('高山')) return '高山';
  // 上記にマッチしない場合：管内名から「管内」を除いた先頭4文字
  return kanai.replace('管内', '').replace(/[（(）)]/g, '').slice(0, 4);
}

// ファイル名プレフィックス（略称_No）
function filePrefix(site) {
  return `${kanaiAbbr(site.kanai)}_${site.no}`;
}

// ===== カメラ =====
// 撮影後のファイルをBlobとして保持し、保存確認UIへ渡す
document.getElementById('camera-input').addEventListener('change', function(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (typeof window._onCameraShot === 'function') window._onCameraShot(file);
});

function openCamera(onShot) {
  window._onCameraShot = onShot;
  document.getElementById('camera-input').click();
}

// ===== 起動 =====
async function init() {
  try {
    const res = await fetch(JSON_URL + '?_=' + Date.now());
    const data = await res.json();
    allSites = data.sites;
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('home-screen').style.display = 'block';
    renderSiteList(allSites);
  } catch(e) {
    document.getElementById('loading-msg').textContent = '読み込み失敗。オフライン？';
    try {
      const res2 = await fetch(JSON_URL);
      const data2 = await res2.json();
      allSites = data2.sites;
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'block';
      renderSiteList(allSites);
    } catch(e2) {
      document.getElementById('loading-msg').textContent = 'ネットワークエラー。Wi-Fiを確認してください。';
    }
  }
}

// ===== ホーム描画 =====
function renderSiteList(sites) {
  const container = document.getElementById('site-list');
  const groups = {};
  const order = [];
  sites.forEach(s => {
    if (!groups[s.kanai]) { groups[s.kanai] = []; order.push(s.kanai); }
    groups[s.kanai].push(s);
  });
  let html = '';
  order.forEach(kanai => {
    html += `<div class="kanai-group"><div class="kanai-header">${kanai}</div>`;
    groups[kanai].forEach(s => {
      const noClass = s.type === '新規' ? 'site-no shinki' : 'site-no';
      const kpText = s.start_kp != null ? `${s.start_kp}kp〜${s.end_kp}kp（${s.distance_m}m）` : '距離標未登録';
      const saved = loadProgress(s.no + '_' + s.kanai);
      const isCompleted = saved && saved.completed;
      const doneCount = saved ? (saved.shinki_count || (saved.p_done ? Object.keys(saved.p_done).filter(k=>saved.p_done[k]).length : 0)) : 0;
      const countBadge = doneCount > 0 && !isCompleted ? `<span style="font-size:12px;color:#27ae60;margin-left:4px;">✓${doneCount}枚</span>` : '';
      const itemClass = isCompleted ? 'site-item completed' : 'site-item';
      const rightIcon = isCompleted
        ? `<span class="site-done-badge">✅</span>`
        : `<span class="site-arrow">›</span>`;
      html += `<div class="${itemClass}" onclick="selectSite('${encodeURIComponent(s.no + '_' + s.kanai)}')">
        <span class="${noClass}">${s.no}</span>
        <div class="site-name-wrap">
          <div class="site-name">${s.name}${countBadge}</div>
          <div class="site-kp">${kpText}</div>
        </div>
        ${rightIcon}
      </div>`;
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function filterSites() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if (!q) { renderSiteList(allSites); return; }
  const filtered = allSites.filter(s =>
    s.name.toLowerCase().includes(q) || s.no.toLowerCase().includes(q) || s.kanai.toLowerCase().includes(q)
  );
  renderSiteList(filtered);
}

// ===== 箇所選択 =====
function selectSite(key) {
  const decoded = decodeURIComponent(key);
  const idx = decoded.indexOf('_');
  const no = decoded.slice(0, idx);
  const kanai = decoded.slice(idx + 1);
  currentSite = allSites.find(s => s.no === no && s.kanai === kanai);
  if (!currentSite) return;
  renderShootScreen();
}

// ===== 撮影画面 =====
function renderShootScreen() {
  const s = currentSite;
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('shoot-screen').style.display = 'block';
  document.getElementById('sh-kanai').textContent = s.kanai;
  document.getElementById('sh-no-name').textContent = `No.${s.no}　${s.name}`;

  let infoHtml = `<div class="info-row">
    <span class="info-label">名称</span>
    <span class="info-value">${s.name}<span class="info-badge${s.type==='新規'?' shinki':''}">${s.type}</span></span>
  </div>`;
  if (s.start_kp != null) {
    infoHtml += `<div class="info-row">
      <span class="info-label">距離標</span>
      <span class="info-value">起点 ${s.start_kp}kp〜終点 ${s.end_kp}kp</span>
    </div>
    <div class="info-row">
      <span class="info-label">区間距離</span>
      <span class="info-value" style="color:#1a5c9a;font-weight:bold;">${s.distance_m} m</span>
    </div>`;
  } else {
    infoHtml += `<div class="info-row"><span class="info-label">距離標</span><span class="info-value" style="color:#999;">未登録</span></div>`;
  }
  infoHtml += `<div class="info-row"><span class="info-label">方向</span><span class="info-value">${s.direction || '―'}</span></div>`;
  document.getElementById('site-info-panel').innerHTML = infoHtml;

  if (s.type === '新規') renderShinkiMode();
  else renderKizonMode();
}

// ===== 保存ヘルパー =====
// Blobをファイル名付きでダウンロード保存（iPhoneの「ファイル」アプリ or 写真に保存）
function savePhoto(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

// ===== DataURL → Blob =====
function dataURLtoBlob(dataURL) {
  const arr = dataURL.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

// FileオブジェクトをDataURLに変換
function fileToDataURL(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

// ===== 新規モード =====
function renderShinkiMode() {
  const s = currentSite;
  const key = s.no + '_' + s.kanai;
  let prog = loadProgress(key) || { shinki_count: 0, thumbs: [] };
  if (!prog.thumbs) prog.thumbs = [];
  // 保存待ち状態
  let pendingFile = null;
  let pendingDataURL = null;
  let pendingFilename = null;

  function nextFilename() {
    return `${filePrefix(s)}_${String((prog.shinki_count || 0) + 1).padStart(3,'0')}.jpg`;
  }

  function redraw() {
    const num = prog.shinki_count || 0;
    const fn = nextFilename();

    // サムネイルHTML
    let thumbHtml = '';
    if (prog.thumbs.length > 0) {
      thumbHtml = '<div class="thumb-grid">';
      prog.thumbs.forEach((t, i) => {
        thumbHtml += `<div class="thumb-item">
          <img src="${t.dataURL}" loading="lazy">
          <div class="thumb-label">${t.filename}</div>
          <button class="thumb-del" onclick="shinkiDelThumb(${i})" title="削除">×</button>
        </div>`;
      });
      thumbHtml += '</div>';
    }

    // 保存確認バーHTML
    let confirmHtml = '';
    if (pendingDataURL) {
      confirmHtml = `<div class="save-confirm-bar" id="save-bar">
        <img src="${pendingDataURL}">
        <div class="save-confirm-info">
          <div class="save-confirm-fname">${pendingFilename}</div>
          <div class="save-confirm-hint">保存してください</div>
        </div>
        <div class="save-confirm-btns">
          <button class="btn-save" onclick="shinkiSave()">💾 保存</button>
          <button class="btn-retake" onclick="shinkiRetake()">撮り直し</button>
        </div>
      </div>`;
    }

    document.getElementById('shoot-body').innerHTML = `
      <div class="shinki-panel">
        <div class="shinki-top">
          <div class="counter-big">${num}</div>
          <div class="counter-info">
            <div class="counter-label">撮影済み</div>
            <div class="counter-next">次：${fn}</div>
          </div>
        </div>
        ${thumbHtml}
      </div>
      ${confirmHtml}
      <button class="shoot-btn-big" onclick="shinkiShoot()" ${pendingDataURL ? 'disabled style="opacity:.5"' : ''}>📷　撮影（${String(num+1).padStart(3,'0')}）</button>
      <button class="complete-btn" onclick="confirmComplete()">✔ この箇所を完了</button>`;
  }

  window.shinkiShoot = function() {
    pendingFilename = nextFilename();
    openCamera(async function(file) {
      pendingFile = file;
      pendingDataURL = await fileToDataURL(file);
      redraw();
    });
  };

  window.shinkiSave = function() {
    if (!pendingFile) return;
    savePhoto(pendingFile, pendingFilename);
    // サムネイル追加（DataURL保存）
    prog.shinki_count = (prog.shinki_count || 0) + 1;
    prog.thumbs.push({ filename: pendingFilename, dataURL: pendingDataURL });
    saveProgress(key, prog);
    showToast('保存：' + pendingFilename);
    pendingFile = null; pendingDataURL = null; pendingFilename = null;
    redraw();
  };

  window.shinkiRetake = function() {
    pendingFile = null; pendingDataURL = null; pendingFilename = null;
    redraw();
  };

  window.shinkiDelThumb = function(i) {
    prog.thumbs.splice(i, 1);
    prog.shinki_count = prog.thumbs.length;
    saveProgress(key, prog);
    redraw();
  };

  redraw();
}

// ===== 既存モード =====
function renderKizonMode() {
  const s = currentSite;
  const key = s.no + '_' + s.kanai;
  let prog = loadProgress(key) || { p_done: {}, p_pano: {}, p_thumbs: {} };
  if (!prog.p_done) prog.p_done = {};
  if (!prog.p_pano) prog.p_pano = {};
  if (!prog.p_thumbs) prog.p_thumbs = {};

  // 保存待ち状態（1件のみ）
  let pendingFile = null;
  let pendingDataURL = null;
  let pendingFilename = null;
  let pendingPkey = null;
  let pendingIsPano = false;

  function getP(n) { return `P${n}`; }

  function getMaxP() {
    const keys = Object.keys(prog.p_done || {});
    if (keys.length === 0) return 3;
    const nums = keys.map(k => parseInt(k.replace('P',''))).filter(n => !isNaN(n));
    return Math.max(...nums, 3);
  }

  function redraw() {
    const maxP = getMaxP();

    // P番号グリッド
    let gridHtml = '<div class="p-grid">';
    for (let i = 1; i <= maxP; i++) {
      const pkey = getP(i);
      const done = prog.p_done[pkey];
      const hasPano = prog.p_pano[pkey];
      let cls = 'p-card';
      if (hasPano) cls += ' pano-done';
      else if (done) cls += ' done';
      const thumb = prog.p_thumbs[pkey];
      const thumbHtml = thumb
        ? `<img class="p-thumb" src="${thumb}" loading="lazy">`
        : `<div class="p-thumb-empty">📷</div>`;
      const statusTxt = done ? (hasPano ? 'パノラマ済' : '撮影済') : '未撮影';
      gridHtml += `<div class="${cls}">
        <div class="p-card-header" onclick="toggleP(${i})">
          <div class="p-num">${pkey}</div>
          <div class="p-status">${statusTxt}</div>
        </div>
        ${thumbHtml ? `<div onclick="toggleP(${i})">${thumbHtml}</div>` : `<div onclick="toggleP(${i})">${thumbHtml}</div>`}
        <button class="p-pano-btn" onclick="addPano(${i})" ${done ? '' : 'style="display:none"'}>＋パノラマ撮影</button>
      </div>`;
    }
    gridHtml += '</div>';

    // 保存確認バー
    let confirmHtml = '';
    if (pendingDataURL) {
      confirmHtml = `<div class="save-confirm-bar">
        <img src="${pendingDataURL}">
        <div class="save-confirm-info">
          <div class="save-confirm-fname">${pendingFilename}</div>
          <div class="save-confirm-hint">保存してください</div>
        </div>
        <div class="save-confirm-btns">
          <button class="btn-save" onclick="kizonSave()">💾 保存</button>
          <button class="btn-retake" onclick="kizonRetake()">撮り直し</button>
        </div>
      </div>`;
    }

    document.getElementById('shoot-body').innerHTML = `
      <div class="p-section-title">P番号チェック（タップで撮影）</div>
      ${gridHtml}
      ${confirmHtml}
      <button class="add-p-btn" onclick="addPNum()">＋ P番号を追加</button>
      <button class="complete-btn" onclick="confirmComplete()">✔ この箇所を完了</button>`;
  }

  window.toggleP = function(n) {
    if (pendingDataURL) return; // 保存待ち中は操作しない
    const pkey = getP(n);
    if (prog.p_done[pkey]) {
      // 撮影済み → 取消確認
      if (!confirm(`${filePrefix(s)}_${pkey} を取り消しますか？`)) return;
      delete prog.p_done[pkey];
      delete prog.p_pano[pkey];
      delete prog.p_thumbs[pkey];
      saveProgress(key, prog);
      redraw();
    } else {
      // 未撮影 → カメラ起動
      pendingPkey = pkey;
      pendingIsPano = false;
      pendingFilename = `${filePrefix(s)}_${pkey}.jpg`;
      openCamera(async function(file) {
        pendingFile = file;
        pendingDataURL = await fileToDataURL(file);
        redraw();
      });
    }
  };

  window.addPano = function(n) {
    if (pendingDataURL) return;
    const pkey = getP(n);
    const nextPano = (prog.p_pano[pkey] || 0) + 1;
    pendingPkey = pkey;
    pendingIsPano = true;
    pendingFilename = `${filePrefix(s)}_${pkey}-pano${nextPano}.jpg`;
    openCamera(async function(file) {
      pendingFile = file;
      pendingDataURL = await fileToDataURL(file);
      redraw();
    });
  };

  window.kizonSave = function() {
    if (!pendingFile) return;
    savePhoto(pendingFile, pendingFilename);
    if (pendingIsPano) {
      const nextPano = (prog.p_pano[pendingPkey] || 0) + 1;
      prog.p_pano[pendingPkey] = nextPano;
    } else {
      prog.p_done[pendingPkey] = true;
      prog.p_thumbs[pendingPkey] = pendingDataURL; // サムネイル保存
    }
    saveProgress(key, prog);
    showToast('保存：' + pendingFilename);
    pendingFile = null; pendingDataURL = null; pendingFilename = null;
    pendingPkey = null; pendingIsPano = false;
    redraw();
  };

  window.kizonRetake = function() {
    pendingFile = null; pendingDataURL = null; pendingFilename = null;
    pendingPkey = null; pendingIsPano = false;
    redraw();
  };

  window.addPNum = function() {
    const newN = getMaxP() + 1;
    prog.p_done[getP(newN)] = false;
    saveProgress(key, prog);
    redraw();
  };

  redraw();
}

// ===== 完了確認 =====
window.confirmComplete = function() {
  const s = currentSite;
  const shots = (function() {
    const key = s.no + '_' + s.kanai;
    const prog = loadProgress(key) || {};
    if (s.type === '新規') return prog.shinki_count || 0;
    return Object.keys(prog.p_done || {}).filter(k => prog.p_done[k]).length;
  })();
  if (confirm(`No.${s.no}　${s.name}\nを完了としますか？\n（撮影済み ${shots}枚）`)) {
    const key = s.no + '_' + s.kanai;
    let prog = loadProgress(key) || {};
    prog.completed = true;
    prog.completed_date = todayStr();
    saveProgress(key, prog);
    goBack();
  }
};

// ===== 日付ヘルパー =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(str) {
  if (!str) return '日付不明';
  const [y, m, d] = str.split('-');
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}

// ===== 完了履歴 =====
function showHistory() {
  // 全箇所のprogを集めて日付でグループ化
  const byDate = {};
  allSites.forEach(s => {
    const key = s.no + '_' + s.kanai;
    const prog = loadProgress(key);
    if (!prog || !prog.completed) return;
    const date = prog.completed_date || '日付なし';
    if (!byDate[date]) byDate[date] = [];
    const shots = s.type === '新規'
      ? (prog.shinki_count || 0)
      : Object.keys(prog.p_done || {}).filter(k => prog.p_done[k]).length;
    byDate[date].push({ s, shots });
  });

  const dates = Object.keys(byDate).sort().reverse(); // 新しい順
  let html = '';
  if (dates.length === 0) {
    html = '<div class="hist-empty">完了した箇所はまだありません</div>';
  } else {
    dates.forEach(date => {
      const items = byDate[date];
      const totalShots = items.reduce((a, b) => a + b.shots, 0);
      html += `<div class="hist-day">
        <span>${formatDate(date)}</span>
        <span class="hist-count">${items.length}箇所・計${totalShots}枚</span>
      </div>`;
      items.forEach(({ s, shots }) => {
        const noClass = s.type === '新規' ? 'hist-no shinki' : 'hist-no';
        html += `<div class="hist-item">
          <span class="${noClass}">${s.no}</span>
          <span class="hist-name">${s.name}</span>
          <span class="hist-shots">📷 ${shots}枚</span>
        </div>`;
      });
    });
  }

  document.getElementById('history-body').innerHTML = html;
  document.getElementById('history-modal').style.display = 'flex';
}

function hideHistory(e) {
  if (e && e.target !== document.getElementById('history-modal')) return;
  document.getElementById('history-modal').style.display = 'none';
}

// ===== 戻る =====
window.goBack = function() {
  document.getElementById('shoot-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  renderSiteList(allSites);
};

// ===== トースト =====
function showToast(msg) {
  const t = document.getElementById('fn-toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== localStorage =====
function saveProgress(key, data) {
  try { localStorage.setItem('prog_' + key, JSON.stringify(data)); } catch(e) {}
}
function loadProgress(key) {
  try {
    const v = localStorage.getItem('prog_' + key);
    return v ? JSON.parse(v) : null;
  } catch(e) { return null; }
}

init();
</script>
