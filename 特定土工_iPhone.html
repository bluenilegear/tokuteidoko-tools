<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="特定土工">
<title>特定土工</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f0f0; }

  /* ===== ホーム画面 ===== */
  .home-header {
    background: #1a5c9a;
    color: white;
    padding: 16px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .search-box {
    background: white;
    padding: 10px 12px 6px;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f8f8f8;
    margin-bottom: 6px;
  }

  /* 管内フィルターボタン */
  .kanai-filter {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .kanai-filter::-webkit-scrollbar { display: none; }
  .kf-btn {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 20px;
    border: 2px solid #1a5c9a;
    background: white;
    color: #1a5c9a;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
  }
  .kf-btn.active {
    background: #1a5c9a;
    color: white;
  }
  .kf-btn:active { opacity: 0.7; }

  .kanai-group { margin-bottom: 2px; }
  .kanai-header {
    background: #2c7bb6;
    color: white;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .site-item {
    background: white;
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
  }
  .site-item:active { background: #e8f0fa; }
  .site-no {
    background: #1a5c9a;
    color: white;
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 12px;
    font-weight: bold;
    min-width: 50px;
    text-align: center;
    flex-shrink: 0;
  }
  .site-no.shinki { background: #e67e22; }
  .site-name-wrap { flex: 1; }
  .site-name { font-size: 15px; color: #222; }
  .site-kp { font-size: 12px; color: #888; margin-top: 2px; }
  .site-arrow { color: #aaa; font-size: 18px; }

  /* 完了履歴ボタン */
  .history-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 10px 12px 4px;
    background: white;
    border: 2px solid #1a5c9a;
    color: #1a5c9a;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
  }
  .history-btn:active { background: #e8f0fa; }

  /* 履歴モーダル */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 500;
    display: flex; align-items: flex-end;
  }
  .modal-sheet {
    background: white;
    width: 100%;
    max-height: 85vh;
    border-radius: 16px 16px 0 0;
    overflow-y: auto;
    padding: 0 0 32px;
  }
  .modal-header {
    position: sticky; top: 0;
    background: white;
    border-bottom: 1px solid #eee;
    padding: 14px 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 17px; font-weight: bold; color: #1a1a1a; }
  .modal-close {
    background: #eee; border: none; border-radius: 50%;
    width: 30px; height: 30px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .hist-day {
    padding: 10px 16px 4px;
    font-size: 13px; font-weight: bold; color: #1a5c9a;
    border-bottom: 1px solid #e8f0fa;
    background: #f5f8ff;
    display: flex; align-items: center; justify-content: space-between;
  }
  .hist-count { font-size: 12px; color: #555; font-weight: normal; }
  .hist-item {
    padding: 9px 16px 9px 24px;
    border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 8px;
  }
  .hist-no {
    background: #1a5c9a; color: white;
    border-radius: 4px; padding: 2px 7px;
    font-size: 12px; font-weight: bold; flex-shrink: 0;
  }
  .hist-no.shinki { background: #e67e22; }
  .hist-name { font-size: 14px; color: #333; flex: 1; }
  .hist-shots { font-size: 12px; color: #27ae60; flex-shrink: 0; }
  .hist-undo-btn {
    background: none; border: 1px solid #e74c3c; color: #e74c3c;
    border-radius: 5px; padding: 3px 8px; font-size: 11px;
    cursor: pointer; flex-shrink: 0;
  }
  .hist-undo-btn:active { background: #fdecea; }
  .hist-empty { padding: 24px; text-align: center; color: #aaa; font-size: 14px; }

  /* 箇所追加ボタン */
  .add-site-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 4px 12px 10px;
    background: #e67e22;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
  }
  .add-site-btn:active { background: #ca6f1e; }

  /* 箇所追加フォーム */
  .add-form { padding: 14px 16px; }
  .add-form-row { margin-bottom: 12px; }
  .add-form-label {
    display: block; font-size: 12px; font-weight: bold;
    color: #555; margin-bottom: 4px;
  }
  .add-form-input {
    width: 100%; padding: 10px 12px;
    font-size: 16px; border: 1px solid #ccc;
    border-radius: 8px; background: #fafafa;
  }
  .add-form-input:focus { border-color: #1a5c9a; outline: none; background: white; }
  .add-form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .add-form-select {
    width: 100%; padding: 10px 12px;
    font-size: 15px; border: 1px solid #ccc;
    border-radius: 8px; background: #fafafa;
    -webkit-appearance: none;
  }

  /* GPS取得ボタン */
  .gps-row {
    display: flex; gap: 8px; align-items: center; margin-bottom: 4px;
  }
  .gps-btn {
    background: #27ae60; color: white; border: none;
    border-radius: 8px; padding: 9px 12px;
    font-size: 13px; font-weight: bold; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .gps-btn:active { background: #1e8449; }
  .gps-btn.loading { background: #aaa; }
  .gps-result {
    font-size: 12px; color: #1a5c9a;
    font-family: monospace; background: #f0f4fa;
    padding: 6px 10px; border-radius: 6px; flex: 1;
    min-height: 34px; display: flex; align-items: center;
  }
  .gps-result.error { color: #c0392b; background: #fdecea; }

  .add-submit-btn {
    width: 100%; background: #1a5c9a; color: white;
    border: none; border-radius: 10px; padding: 14px;
    font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 4px;
  }
  .add-submit-btn:active { background: #154d82; }
  /* 完了済み箇所 */
  .site-item.completed { background: #f5f5f5; }
  .site-item.completed .site-name { color: #999; text-decoration: line-through; }
  .site-item.completed .site-no { background: #aaa; }
  .site-item.completed .site-no.shinki { background: #c8a87a; }
  .site-done-badge {
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ===== 撮影画面 ===== */
  #shoot-screen { display: none; }
  .shoot-header {
    background: #1a5c9a;
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .shoot-header-top {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    gap: 10px;
  }
  .back-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .shoot-title {
    flex: 1;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
  }
  .shoot-kanai { font-size: 12px; font-weight: normal; opacity: 0.8; }

  /* ===== 箇所タブ ===== */
  .site-tabs-bar {
    background: #154d82;
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    border-bottom: 2px solid #0d3a63;
  }
  .site-tabs-bar::-webkit-scrollbar { display: none; }
  .site-tab {
    flex-shrink: 0;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: bold;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
  .site-tab.active {
    color: white;
    border-bottom-color: #ffd600;
  }
  .site-tab-add {
    flex-shrink: 0;
    padding: 8px 14px;
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
  .site-tab-add:active { color: white; }

  /* 箇所情報パネル */
  .site-info-panel {
    background: #e8f0fa;
    border-bottom: 2px solid #1a5c9a;
    padding: 10px 16px;
  }
  .info-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .info-label { font-size: 11px; color: #555; font-weight: bold; min-width: 46px; flex-shrink: 0; }
  .info-value { font-size: 14px; color: #1a1a1a; font-weight: 500; }
  .info-badge {
    display: inline-block;
    background: #1a5c9a;
    color: white;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 11px;
    margin-left: 6px;
  }
  .info-badge.shinki { background: #e67e22; }

  /* 撮影本体 */
  .shoot-body { padding: 12px; }

  /* ===== 新規モード ===== */
  .shinki-panel {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .shinki-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .counter-big {
    font-size: 56px;
    font-weight: bold;
    color: #e67e22;
    line-height: 1;
    flex-shrink: 0;
    min-width: 64px;
    text-align: center;
  }
  .counter-info { flex: 1; }
  .counter-label { font-size: 13px; color: #888; }
  .counter-next {
    font-size: 12px;
    color: #1a5c9a;
    font-family: monospace;
    background: #f0f4fa;
    padding: 3px 7px;
    border-radius: 4px;
    margin-top: 4px;
    display: inline-block;
  }

  /* サムネイルグリッド（新規・既存共通） */
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-top: 8px;
  }
  .thumb-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 5px;
    overflow: hidden;
    background: #eee;
    cursor: pointer;
  }
  .thumb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.55);
    color: white;
    font-size: 9px;
    font-family: monospace;
    padding: 2px 3px;
    text-align: center;
    line-height: 1.2;
  }
  .thumb-del {
    position: absolute;
    top: 2px; right: 2px;
    background: rgba(192,57,43,0.85);
    color: white;
    border: none;
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  /* 保存待ちオーバーレイ */
  .thumb-pending {
    position: absolute;
    inset: 0;
    background: rgba(231,76,60,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
    padding: 3px;
  }

  /* 撮影ボタン */
  .shoot-btn-big {
    width: 100%;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .shoot-btn-big:active { background: #1e8449; }

  /* 保存確認エリア（撮影直後に出現） */
  .save-confirm-bar {
    background: #fef9e7;
    border: 2px solid #f39c12;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .save-confirm-bar img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .save-confirm-info { flex: 1; }
  .save-confirm-fname {
    font-family: monospace;
    font-size: 13px;
    color: #1a1a1a;
    font-weight: bold;
  }
  .save-confirm-hint { font-size: 11px; color: #888; margin-top: 2px; }
  .save-confirm-btns { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .btn-save {
    background: #2980b9;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-save:active { background: #1f6391; }
  .btn-retake {
    background: #bdc3c7;
    color: #333;
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-retake:active { background: #aaa; }

  .undo-btn {
    width: 100%;
    background: #95a5a6;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .undo-btn:active { background: #7f8c8d; }

  /* ===== 既存モード P番号 ===== */
  .p-section-title {
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin: 10px 0 6px;
    padding-left: 2px;
  }
  .p-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .p-card {
    background: white;
    border: 2px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    transition: border-color 0.15s;
  }
  .p-card.done { border-color: #1a5c9a; }
  .p-card.pano-done { border-color: #8e44ad; }
  .p-card-header {
    padding: 8px 6px 4px;
    text-align: center;
  }
  .p-card.done .p-card-header { background: #1a5c9a; color: white; }
  .p-card.pano-done .p-card-header { background: #8e44ad; color: white; }
  .p-num { font-size: 16px; font-weight: bold; }
  .p-status { font-size: 10px; margin-top: 1px; opacity: 0.85; }
  /* P番号カード内サムネイル */
  .p-thumb {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .p-thumb-empty {
    width: 100%;
    aspect-ratio: 4/3;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 22px;
  }
  .p-pano-btn {
    display: block;
    width: 100%;
    font-size: 11px;
    background: rgba(0,0,0,0.07);
    border: none;
    border-top: 1px solid rgba(0,0,0,0.1);
    color: #555;
    padding: 5px;
    cursor: pointer;
    text-align: center;
  }
  .p-card.done .p-pano-btn,
  .p-card.pano-done .p-pano-btn { color: inherit; background: rgba(255,255,255,0.15); border-top-color: rgba(255,255,255,0.2); }

  .add-p-btn {
    width: 100%;
    background: #ecf0f1;
    border: 2px dashed #bdc3c7;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    color: #7f8c8d;
    cursor: pointer;
    margin-top: 2px;
    margin-bottom: 10px;
  }
  .add-p-btn:active { background: #d5dbdb; }

  /* 完了ボタン */
  .complete-btn {
    width: 100%;
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  .complete-btn:active { background: #a93226; }

  /* トースト */
  .fn-toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-family: monospace;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  .fn-toast.show { opacity: 1; }

  /* ローディング */
  #loading-screen {
    position: fixed; inset: 0;
    background: #1a5c9a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: white; z-index: 9999;
  }
  .loading-title { font-size: 28px; font-weight: bold; letter-spacing: 3px; margin-bottom: 20px; }
  .loading-sub { font-size: 14px; opacity: 0.8; }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 箇所選択モーダル（タブ追加用） */
  .site-picker-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 600;
    display: flex; align-items: flex-end;
  }
  .site-picker-sheet {
    background: white;
    width: 100%;
    max-height: 80vh;
    border-radius: 16px 16px 0 0;
    overflow-y: auto;
    padding: 0 0 32px;
  }
  .site-picker-search {
    position: sticky; top: 0; background: white;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
  }
  .site-picker-search input {
    width: 100%; padding: 8px 12px;
    font-size: 15px; border: 1px solid #ccc;
    border-radius: 8px; background: #f8f8f8;
  }
  .site-picker-item {
    padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
  }
  .site-picker-item:active { background: #e8f0fa; }
  .site-picker-item.already-open {
    background: #f5f5f5;
    opacity: 0.5;
  }
</style>
</head>
<body>

<!-- ローディング -->
<div id="loading-screen">
  <div class="loading-title">特定土工</div>
  <div class="spinner"></div>
  <div class="loading-sub" id="loading-msg">箇所リストを読み込み中…</div>
</div>

<!-- ホーム画面 -->
<div id="home-screen" style="display:none;">
  <div class="home-header">特定土工</div>
  <div class="search-box">
    <input type="search" id="search-input" placeholder="箇所名・No.で絞り込み">
    <div class="kanai-filter" id="kanai-filter">
      <!-- 管内フィルターボタンがここに入る -->
    </div>
  </div>
  <button class="add-site-btn" id="add-site-btn">＋　新規箇所を追加</button>
  <button class="history-btn" id="history-btn">📋　完了履歴を見る</button>
  <div id="site-list"></div>
</div>

<!-- 箇所追加モーダル -->
<div class="modal-overlay" id="addsite-modal" style="display:none;">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">＋ 新規箇所を追加</span>

<script>
const JSON_URL = 'https://raw.githubusercontent.com/bluenilegear/tokuteidoko-tools/main/kasho-list.json';

let allSites = [];
let toastTimer = null;

// ===== 複数箇所タブ管理 =====
let openSites = [];     // 開いている箇所の配列 [{no, kanai}, ...]
let currentTabIdx = 0;  // 現在のタブインデックス

function currentSite() {
  if (openSites.length === 0) return null;
  const ref = openSites[currentTabIdx];
  return allSites.find(s => s.no === ref.no && s.kanai === ref.kanai) || null;
}

// ===== 管内略称（ファイル名に使用） =====
function kanaiAbbr(kanai) {
  if (kanai.includes('雪崩')) return '神岡雪崩';
  if (kanai.includes('落石') || kanai.includes('落防')) return '神岡落石';
  if (kanai.includes('神岡')) return '神岡落石';
  if (kanai.includes('下呂')) return '下呂';
  if (kanai.includes('高山')) return '高山';
  return kanai.replace('管内', '').replace(/[（(）)]/g, '').slice(0, 4);
}

function filePrefix(site) {
  return kanaiAbbr(site.kanai) + '_' + site.no;
}

// ===== カメラ =====
function openCamera(onShot) {
  // iOSでは同じinput要素の連続使用でchangeが発火しないため毎回作り直す
  const old = document.getElementById('camera-input');
  if (old) old.remove();
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.id = 'camera-input';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    onShot(file);
  });
  input.click();
}

// ===== 起動 =====
async function init() {
  try {
    const res = await fetch(JSON_URL + '?_=' + Date.now());
    const data = await res.json();
    allSites = data.sites.concat(loadUserSites());
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('home-screen').style.display = 'block';
    renderKanaiFilter();
    renderSiteList(allSites);
  } catch(e) {
    document.getElementById('loading-msg').textContent = '読み込み失敗。オフライン？';
    try {
      const res2 = await fetch(JSON_URL);
      const data2 = await res2.json();
      allSites = data2.sites.concat(loadUserSites());
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'block';
      renderKanaiFilter();
      renderSiteList(allSites);
    } catch(e2) {
      document.getElementById('loading-msg').textContent = 'ネットワークエラー。Wi-Fiを確認してください。';
    }
  }
}

// ===== 管内フィルター =====
let activeKanai = null; // null = 全て

function getKanaiList() {
  const seen = {};
  const list = [];
  allSites.forEach(function(s) {
    if (!seen[s.kanai]) { seen[s.kanai] = true; list.push(s.kanai); }
  });
  return list;
}

function renderKanaiFilter() {
  const kanaiList = getKanaiList();
  const bar = document.getElementById('kanai-filter');
  let html = '<button class="kf-btn' + (activeKanai === null ? ' active' : '') + '" data-kanai="">全て</button>';
  kanaiList.forEach(function(k) {
    const isActive = activeKanai === k;
    // 管内名を短縮表示
    const short = k.replace('管内', '').replace(/[（(）)]/g, '');
    html += '<button class="kf-btn' + (isActive ? ' active' : '') + '" data-kanai="' + k + '">' + short + '</button>';
  });
  bar.innerHTML = html;
}

document.getElementById('kanai-filter').addEventListener('click', function(e) {
  const btn = e.target.closest('.kf-btn');
  if (!btn) return;
  activeKanai = btn.dataset.kanai || null;
  renderKanaiFilter();
  filterSites();
});

// ===== ホーム描画 =====
function renderSiteList(sites) {
  const container = document.getElementById('site-list');
  const groups = {};
  const order = [];
  sites.forEach(function(s) {
    if (!groups[s.kanai]) { groups[s.kanai] = []; order.push(s.kanai); }
    groups[s.kanai].push(s);
  });
  let html = '';
  order.forEach(function(kanai) {
    html += '<div class="kanai-group"><div class="kanai-header">' + kanai + '</div>';
    groups[kanai].forEach(function(s) {
      const noClass = s.type === '新規' ? 'site-no shinki' : 'site-no';
      const kpText = s.start_kp != null ? s.start_kp + 'kp〜' + s.end_kp + 'kp（' + s.distance_m + 'm）' : '距離標未登録';
      const saved = loadProgress(s.no + '_' + s.kanai);
      const isCompleted = saved && saved.completed;
      const doneCount = saved ? (saved.shinki_count || (saved.p_done ? Object.keys(saved.p_done).filter(function(k){ return saved.p_done[k]; }).length : 0)) : 0;
      const countBadge = doneCount > 0 && !isCompleted ? '<span style="font-size:12px;color:#27ae60;margin-left:4px;">✓' + doneCount + '枚</span>' : '';
      const itemClass = isCompleted ? 'site-item completed' : 'site-item';
      const rightIcon = isCompleted ? '<span class="site-done-badge">✅</span>' : '<span class="site-arrow">›</span>';
      const encKey = encodeURIComponent(s.no + '|||' + s.kanai);
      html += '<div class="' + itemClass + '" data-select-site="' + encKey + '">'
        + '<span class="' + noClass + '">' + s.no + '</span>'
        + '<div class="site-name-wrap">'
        + '<div class="site-name">' + s.name + countBadge + '</div>'
        + '<div class="site-kp">' + kpText + '</div>'
        + '</div>'
        + rightIcon
        + '</div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

document.getElementById('site-list').addEventListener('click', function(e) {
  const item = e.target.closest('[data-select-site]');
  if (!item) return;
  const decoded = decodeURIComponent(item.dataset.selectSite);
  const parts = decoded.split('|||');
  const no = parts[0], kanai = parts[1];
  const key = no + '_' + kanai;
  const prog = loadProgress(key) || {};
  // 完了済みの場合は解除確認
  if (prog.completed) {
    const site = allSites.find(function(s) { return s.no === no && s.kanai === kanai; });
    const name = site ? site.name : no;
    if (confirm('No.' + no + '　' + name + '\nはすでに完了しています。\n完了を解除して編集しますか？')) {
      delete prog.completed;
      delete prog.completed_date;
      saveProgress(key, prog);
      renderSiteList(allSites.filter ? allSites : allSites);
      filterSites();
      selectSite(no, kanai);
    }
    return;
  }
  selectSite(no, kanai);
});

function filterSites() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  let filtered = allSites;
  if (activeKanai) filtered = filtered.filter(function(s) { return s.kanai === activeKanai; });
  if (q) filtered = filtered.filter(function(s) {
    return s.name.toLowerCase().includes(q) || s.no.toLowerCase().includes(q) || s.kanai.toLowerCase().includes(q);
  });
  renderSiteList(filtered);
}

document.getElementById('search-input').addEventListener('input', filterSites);

// ===== 箇所選択（一覧から） =====
function selectSite(no, kanai) {
  const site = allSites.find(function(s) { return s.no === no && s.kanai === kanai; });
  if (!site) return;
  // すでに開いているか確認
  const existIdx = openSites.findIndex(function(r) { return r.no === no && r.kanai === kanai; });
  if (existIdx >= 0) {
    currentTabIdx = existIdx;
  } else {
    openSites.push({ no: no, kanai: kanai });
    currentTabIdx = openSites.length - 1;
  }
  renderShootScreen();
}

// ===== 撮影画面 =====
function renderShootScreen() {
  const s = currentSite();
  if (!s) return;
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('shoot-screen').style.display = 'block';

  // タブバー
  renderSiteTabs();

  // ヘッダー
  document.getElementById('sh-kanai').textContent = s.kanai;
  document.getElementById('sh-no-name').textContent = 'No.' + s.no + '　' + s.name;

  let infoHtml = '<div class="info-row"><span class="info-label">名称</span><span class="info-value">' + s.name + '<span class="info-badge' + (s.type === '新規' ? ' shinki' : '') + '">' + s.type + '</span></span></div>';
  if (s.start_kp != null) {
    infoHtml += '<div class="info-row"><span class="info-label">距離標</span><span class="info-value">起点 ' + s.start_kp + 'kp〜終点 ' + s.end_kp + 'kp</span></div>'
      + '<div class="info-row"><span class="info-label">区間距離</span><span class="info-value" style="color:#1a5c9a;font-weight:bold;">' + s.distance_m + ' m</span></div>';
  } else {
    infoHtml += '<div class="info-row"><span class="info-label">距離標</span><span class="info-value" style="color:#999;">未登録</span></div>';
  }
  infoHtml += '<div class="info-row"><span class="info-label">方向</span><span class="info-value">' + (s.direction || '―') + '</span></div>';
  document.getElementById('site-info-panel').innerHTML = infoHtml;

  if (s.type === '新規') renderShinkiMode();
  else renderKizonMode();
}

// ===== タブバー描画 =====
function renderSiteTabs() {
  const bar = document.getElementById('site-tabs-bar');
  bar.style.display = 'flex';
  let html = '';
  openSites.forEach(function(ref, idx) {
    const site = allSites.find(function(s) { return s.no === ref.no && s.kanai === ref.kanai; });
    const label = site ? 'No.' + site.no : ref.no;
    const cls = idx === currentTabIdx ? 'site-tab active' : 'site-tab';
    // タブが2つ以上あるときだけ×ボタンを表示
    const closeBtn = openSites.length > 1
      ? '<span data-tab-close="' + idx + '" style="margin-left:5px;opacity:0.6;font-size:11px;">✕</span>'
      : '';
    html += '<div class="' + cls + '" data-tab-idx="' + idx + '">' + label + closeBtn + '</div>';
  });
  html += '<div class="site-tab-add" data-tab-add="1">＋ 追加</div>';
  bar.innerHTML = html;
}

document.getElementById('site-tabs-bar').addEventListener('click', function(e) {
  // ×ボタン（タブ閉じる）
  const closeBtn = e.target.closest('[data-tab-close]');
  if (closeBtn) {
    e.stopPropagation();
    const idx = parseInt(closeBtn.dataset.tabClose, 10);
    openSites.splice(idx, 1);
    currentTabIdx = Math.min(currentTabIdx, openSites.length - 1);
    if (openSites.length === 0) { goBack(); return; }
    renderShootScreen();
    return;
  }
  // タブ切り替え
  const tab = e.target.closest('[data-tab-idx]');
  if (tab) {
    const idx = parseInt(tab.dataset.tabIdx, 10);
    if (idx !== currentTabIdx) {
      currentTabIdx = idx;
      renderShootScreen();
    }
    return;
  }
  // ＋追加
  const addBtn = e.target.closest('[data-tab-add]');
  if (addBtn) {
    showSitePicker();
  }
});

// ===== 箇所ピッカー（タブ追加用） =====
function showSitePicker() {
  document.getElementById('picker-search').value = '';
  renderPickerList('');
  document.getElementById('site-picker').style.display = 'flex';
}

function renderPickerList(q) {
  let filtered = allSites;
  if (q) filtered = filtered.filter(function(s) {
    return s.name.toLowerCase().includes(q) || s.no.toLowerCase().includes(q);
  });
  const groups = {};
  const order = [];
  filtered.forEach(function(s) {
    if (!groups[s.kanai]) { groups[s.kanai] = []; order.push(s.kanai); }
    groups[s.kanai].push(s);
  });
  let html = '';
  order.forEach(function(kanai) {
    html += '<div class="kanai-header" style="font-size:12px;padding:6px 16px;">' + kanai + '</div>';
    groups[kanai].forEach(function(s) {
      const alreadyOpen = openSites.some(function(r) { return r.no === s.no && r.kanai === s.kanai; });
      const noClass = s.type === '新規' ? 'site-no shinki' : 'site-no';
      const cls = alreadyOpen ? 'site-picker-item already-open' : 'site-picker-item';
      const encKey = encodeURIComponent(s.no + '|||' + s.kanai);
      html += '<div class="' + cls + '" data-pick-site="' + encKey + '">'
        + '<span class="' + noClass + '">' + s.no + '</span>'
        + '<span style="font-size:14px;color:#222;">' + s.name + '</span>'
        + (alreadyOpen ? '<span style="font-size:11px;color:#aaa;margin-left:auto;">開いています</span>' : '')
        + '</div>';
    });
  });
  document.getElementById('picker-list').innerHTML = html;
}

document.getElementById('picker-list').addEventListener('click', function(e) {
  const item = e.target.closest('[data-pick-site]');
  if (!item) return;
  const decoded = decodeURIComponent(item.dataset.pickSite);
  const parts = decoded.split('|||');
  const no = parts[0];
  const kanai = parts[1];
  const alreadyOpen = openSites.some(function(r) { return r.no === no && r.kanai === kanai; });
  if (alreadyOpen) return;
  openSites.push({ no: no, kanai: kanai });
  currentTabIdx = openSites.length - 1;
  document.getElementById('site-picker').style.display = 'none';
  renderShootScreen();
});

document.getElementById('picker-search').addEventListener('input', function(e) {
  renderPickerList(e.target.value.trim().toLowerCase());
});

document.getElementById('site-picker-close').addEventListener('click', function() {
  document.getElementById('site-picker').style.display = 'none';
});

document.getElementById('site-picker').addEventListener('click', function(e) {
  if (e.target === document.getElementById('site-picker')) {
    document.getElementById('site-picker').style.display = 'none';
  }
});

// ===== 保存ヘルパー =====
function savePhoto(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

function dataURLtoBlob(dataURL) {
  const arr = dataURL.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

function fileToDataURL(file) {
  return new Promise(function(resolve) {
    const r = new FileReader();
    r.onload = function(e) { resolve(e.target.result); };
    r.readAsDataURL(file);
  });
}

// ===== モード状態（タブをまたいで保持） =====
// 各箇所キーごとに pending 状態を保持
const tabStates = {}; // key: { pendingFile, pendingDataURL, pendingFilename, pendingPkey, pendingIsPano }

function getTabState(key) {
  if (!tabStates[key]) {
    tabStates[key] = { pendingFile: null, pendingDataURL: null, pendingFilename: null, pendingPkey: null, pendingIsPano: false };
  }
  return tabStates[key];
}

// ===== shoot-body イベント（一度だけ登録） =====
document.getElementById('shoot-body').addEventListener('click', function(e) {
  const s = currentSite();
  if (!s) return;
  const key = s.no + '_' + s.kanai;
  const ts = getTabState(key);

  if (s.type === '新規') {
    let prog = loadProgress(key) || { shinki_count: 0, thumbs: [] };
    if (!prog.thumbs) prog.thumbs = [];

    // GPS
    const gpsBtn = e.target.closest('[data-shinki-gps]');
    if (gpsBtn) { shinkiGetGPS(gpsBtn.dataset.shinkiGps, key, prog); return; }
    // 撮影
    if (e.target.closest('[data-shinki-shoot]')) {
      if (ts.pendingDataURL) return;
      ts.pendingFilename = filePrefix(s) + '_' + String((prog.shinki_count || 0) + 1).padStart(3, '0') + '.jpg';
      openCamera(function(file) {
        ts.pendingFile = file;
        fileToDataURL(file).then(function(url) { ts.pendingDataURL = url; redrawShoot(); });
      });
      return;
    }
    // 保存
    if (e.target.closest('[data-shinki-save]')) {
      if (!ts.pendingFile) return;
      savePhoto(ts.pendingFile, ts.pendingFilename);
      prog = loadProgress(key) || { shinki_count: 0, thumbs: [] };
      if (!prog.thumbs) prog.thumbs = [];
      prog.shinki_count = (prog.shinki_count || 0) + 1;
      prog.thumbs.push({ filename: ts.pendingFilename, dataURL: ts.pendingDataURL });
      saveProgress(key, prog);
      showToast('保存：' + ts.pendingFilename);
      ts.pendingFile = null; ts.pendingDataURL = null; ts.pendingFilename = null;
      redrawShoot();
      return;
    }
    // 撮り直し
    if (e.target.closest('[data-shinki-retake]')) {
      ts.pendingFile = null; ts.pendingDataURL = null; ts.pendingFilename = null;
      redrawShoot();
      return;
    }
    // サムネイル削除
    const delBtn = e.target.closest('[data-shinki-del]');
    if (delBtn) {
      prog = loadProgress(key) || { shinki_count: 0, thumbs: [] };
      if (!prog.thumbs) prog.thumbs = [];
      const i = parseInt(delBtn.dataset.shinkiDel, 10);
      prog.thumbs.splice(i, 1);
      prog.shinki_count = prog.thumbs.length;
      saveProgress(key, prog);
      redrawShoot();
      return;
    }
  } else {
    // 既存モード
    let prog = loadProgress(key) || { p_done: {}, p_pano: {}, p_thumbs: {} };
    if (!prog.p_done) prog.p_done = {};
    if (!prog.p_pano) prog.p_pano = {};
    if (!prog.p_thumbs) prog.p_thumbs = {};

    function getMaxP() {
      const keys = Object.keys(prog.p_done || {});
      if (keys.length === 0) return 3;
      const nums = keys.map(function(k) { return parseInt(k.replace('P', ''), 10); }).filter(function(n) { return !isNaN(n); });
      return Math.max.apply(null, nums.concat([3]));
    }

    // P番号タップ
    const toggleEl = e.target.closest('[data-toggle-p]');
    if (toggleEl) {
      if (ts.pendingDataURL) return;
      const n = parseInt(toggleEl.dataset.toggleP, 10);
      const pkey = 'P' + n;
      if (prog.p_done[pkey]) {
        delete prog.p_done[pkey];
        delete prog.p_pano[pkey];
        delete prog.p_thumbs[pkey];
        saveProgress(key, prog);
        redrawShoot();
      } else {
        ts.pendingPkey = pkey;
        ts.pendingIsPano = false;
        ts.pendingFilename = filePrefix(s) + '_' + pkey + '.jpg';
        openCamera(function(file) {
          ts.pendingFile = file;
          fileToDataURL(file).then(function(url) { ts.pendingDataURL = url; redrawShoot(); });
        });
      }
      return;
    }
    // パノラマ
    const panoEl = e.target.closest('[data-pano-p]');
    if (panoEl) {
      if (ts.pendingDataURL) return;
      const n = parseInt(panoEl.dataset.panoP, 10);
      const pkey = 'P' + n;
      const nextPano = (prog.p_pano[pkey] || 0) + 1;
      ts.pendingPkey = pkey;
      ts.pendingIsPano = true;
      ts.pendingFilename = filePrefix(s) + '_' + pkey + '-pano' + nextPano + '.jpg';
      openCamera(function(file) {
        ts.pendingFile = file;
        fileToDataURL(file).then(function(url) { ts.pendingDataURL = url; redrawShoot(); });
      });
      return;
    }
    // 保存
    if (e.target.closest('[data-kizon-save]')) {
      if (!ts.pendingFile) return;
      savePhoto(ts.pendingFile, ts.pendingFilename);
      prog = loadProgress(key) || { p_done: {}, p_pano: {}, p_thumbs: {} };
      if (!prog.p_done) prog.p_done = {};
      if (!prog.p_pano) prog.p_pano = {};
      if (!prog.p_thumbs) prog.p_thumbs = {};
      if (ts.pendingIsPano) {
        prog.p_pano[ts.pendingPkey] = (prog.p_pano[ts.pendingPkey] || 0) + 1;
      } else {
        prog.p_done[ts.pendingPkey] = true;
        prog.p_thumbs[ts.pendingPkey] = ts.pendingDataURL;
      }
      saveProgress(key, prog);
      showToast('保存：' + ts.pendingFilename);
      ts.pendingFile = null; ts.pendingDataURL = null; ts.pendingFilename = null;
      ts.pendingPkey = null; ts.pendingIsPano = false;
      redrawShoot();
      return;
    }
    // 撮り直し
    if (e.target.closest('[data-kizon-retake]')) {
      ts.pendingFile = null; ts.pendingDataURL = null; ts.pendingFilename = null;
      ts.pendingPkey = null; ts.pendingIsPano = false;
      redrawShoot();
      return;
    }
    // P追加
    if (e.target.closest('[data-add-p]')) {
      const newN = getMaxP() + 1;
      prog.p_done['P' + newN] = false;
      saveProgress(key, prog);
      redrawShoot();
      return;
    }
  }

  // 完了（新規・既存共通）
  if (e.target.closest('[data-complete]')) {
    confirmComplete();
  }
});

// ===== 新規モード描画 =====
function shinkiGetGPS(which, key, prog) {
  const resultEl = document.getElementById('sh-gps-' + which + '-result');
  const btnEl = document.getElementById('sh-gps-' + which + '-btn');
  if (!resultEl || !btnEl) return;
  btnEl.className = 'gps-btn loading';
  btnEl.disabled = true;
  resultEl.className = 'gps-result';
  resultEl.textContent = '取得中…';
  if (!navigator.geolocation) {
    resultEl.textContent = 'GPS非対応';
    resultEl.className = 'gps-result error';
    btnEl.className = 'gps-btn'; btnEl.disabled = false; return;
  }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);
      if (which === 'start') prog.gps_start = { lat: lat, lon: lon };
      else prog.gps_end = { lat: lat, lon: lon };
      saveProgress(key, prog);
      resultEl.textContent = lat.toFixed(6) + ', ' + lon.toFixed(6) + '（±' + acc + 'm）';
      resultEl.className = 'gps-result';
      btnEl.textContent = '再取得';
      btnEl.className = 'gps-btn'; btnEl.disabled = false;
    },
    function(err) {
      const msg = err.code === 1 ? '許可が必要です' : err.code === 3 ? 'タイムアウト' : '取得失敗';
      resultEl.textContent = 'エラー：' + msg;
      resultEl.className = 'gps-result error';
      btnEl.className = 'gps-btn'; btnEl.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function renderShinkiMode() {
  redrawShoot();
}

function renderKizonMode() {
  redrawShoot();
}

// ===== 統合 redraw（現在のタブの内容を描画） =====
function redrawShoot() {
  const s = currentSite();
  if (!s) return;
  const key = s.no + '_' + s.kanai;
  const ts = getTabState(key);

  if (s.type === '新規') {
    const prog = loadProgress(key) || { shinki_count: 0, thumbs: [] };
    if (!prog.thumbs) prog.thumbs = [];
    const num = prog.shinki_count || 0;
    const fn = filePrefix(s) + '_' + String(num + 1).padStart(3, '0') + '.jpg';

    const gpsStatusHtml = function(which) {
      const data = which === 'start' ? prog.gps_start : prog.gps_end;
      if (data) return data.lat.toFixed(6) + ', ' + data.lon.toFixed(6);
      return '未取得';
    };

    const gpsHtml = '<div style="background:#f8f9fa;border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;">'
      + '<div style="font-size:13px;font-weight:bold;color:#1a5c9a;margin-bottom:8px;">📍 GPS位置情報</div>'
      + '<div class="gps-row" style="margin-bottom:6px;">'
      + '<button class="gps-btn" id="sh-gps-start-btn" data-shinki-gps="start">' + (prog.gps_start ? '再取得' : '起点を取得') + '</button>'
      + '<div class="gps-result" id="sh-gps-start-result">' + gpsStatusHtml('start') + '</div>'
      + '</div>'
      + '<div class="gps-row">'
      + '<button class="gps-btn" id="sh-gps-end-btn" data-shinki-gps="end">' + (prog.gps_end ? '再取得' : '終点を取得') + '</button>'
      + '<div class="gps-result" id="sh-gps-end-result">' + gpsStatusHtml('end') + '</div>'
      + '</div></div>';

    let thumbHtml = '';
    if (prog.thumbs.length > 0) {
      thumbHtml = '<div class="thumb-grid">';
      prog.thumbs.forEach(function(t, i) {
        thumbHtml += '<div class="thumb-item">'
          + '<img src="' + t.dataURL + '" loading="lazy">'
          + '<div class="thumb-label">' + t.filename + '</div>'
          + '<button class="thumb-del" data-shinki-del="' + i + '" title="削除">×</button>'
          + '</div>';
      });
      thumbHtml += '</div>';
    }

    let confirmHtml = '';
    if (ts.pendingDataURL) {
      confirmHtml = '<div class="save-confirm-bar">'
        + '<img src="' + ts.pendingDataURL + '">'
        + '<div class="save-confirm-info">'
        + '<div class="save-confirm-fname">' + ts.pendingFilename + '</div>'
        + '<div class="save-confirm-hint">保存してください</div>'
        + '</div>'
        + '<div class="save-confirm-btns">'
        + '<button class="btn-save" data-shinki-save="1">💾 保存</button>'
        + '<button class="btn-retake" data-shinki-retake="1">撮り直し</button>'
        + '</div></div>';
    }

    document.getElementById('shoot-body').innerHTML =
      '<div class="shinki-panel">'
      + '<div class="shinki-top">'
      + '<div class="counter-big">' + num + '</div>'
      + '<div class="counter-info">'
      + '<div class="counter-label">撮影済み</div>'
      + '<div class="counter-next">次：' + fn + '</div>'
      + '</div></div>'
      + gpsHtml + thumbHtml + '</div>'
      + confirmHtml
      + '<button class="shoot-btn-big" data-shinki-shoot="1"' + (ts.pendingDataURL ? ' disabled style="opacity:.5"' : '') + '>📷　撮影（' + String(num + 1).padStart(3, '0') + '）</button>'
      + '<button class="complete-btn" data-complete="1">✔ この箇所を完了</button>';

  } else {
    // 既存モード
    const prog = loadProgress(key) || { p_done: {}, p_pano: {}, p_thumbs: {} };
    if (!prog.p_done) prog.p_done = {};
    if (!prog.p_pano) prog.p_pano = {};
    if (!prog.p_thumbs) prog.p_thumbs = {};

    const pkeys = Object.keys(prog.p_done);
    const maxP = pkeys.length === 0 ? 3 : Math.max.apply(null, pkeys.map(function(k) { return parseInt(k.replace('P',''),10)||0; }).concat([3]));

    let gridHtml = '<div class="p-grid">';
    for (let i = 1; i <= maxP; i++) {
      const pkey = 'P' + i;
      const done = prog.p_done[pkey];
      const hasPano = prog.p_pano[pkey];
      let cls = 'p-card';
      if (hasPano) cls += ' pano-done';
      else if (done) cls += ' done';
      const thumb = prog.p_thumbs[pkey];
      const thumbHtml = thumb
        ? '<img class="p-thumb" src="' + thumb + '" loading="lazy">'
        : '<div class="p-thumb-empty">📷</div>';
      const statusTxt = done ? (hasPano ? 'パノラマ済' : '撮影済') : '未撮影';
      gridHtml += '<div class="' + cls + '">'
        + '<div class="p-card-header" data-toggle-p="' + i + '">'
        + '<div class="p-num">' + pkey + '</div>'
        + '<div class="p-status">' + statusTxt + '</div>'
        + '</div>'
        + '<div data-toggle-p="' + i + '">' + thumbHtml + '</div>'
        + '<button class="p-pano-btn" data-pano-p="' + i + '"' + (done ? '' : ' style="display:none"') + '>＋パノラマ撮影</button>'
        + '</div>';
    }
    gridHtml += '</div>';

    let confirmHtml = '';
    if (ts.pendingDataURL) {
      confirmHtml = '<div class="save-confirm-bar">'
        + '<img src="' + ts.pendingDataURL + '">'
        + '<div class="save-confirm-info">'
        + '<div class="save-confirm-fname">' + ts.pendingFilename + '</div>'
        + '<div class="save-confirm-hint">保存してください</div>'
        + '</div>'
        + '<div class="save-confirm-btns">'
        + '<button class="btn-save" data-kizon-save="1">💾 保存</button>'
        + '<button class="btn-retake" data-kizon-retake="1">撮り直し</button>'
        + '</div></div>';
    }

    document.getElementById('shoot-body').innerHTML =
      '<div class="p-section-title">P番号チェック（タップで撮影）</div>'
      + gridHtml + confirmHtml
      + '<button class="add-p-btn" data-add-p="1">＋ P番号を追加</button>'
      + '<button class="complete-btn" data-complete="1">✔ この箇所を完了</button>';
  }
}

// ===== 完了確認 =====
function confirmComplete() {
  const s = currentSite();
  if (!s) return;
  const key = s.no + '_' + s.kanai;
  const prog = loadProgress(key) || {};
  const shots = s.type === '新規'
    ? (prog.shinki_count || 0)
    : Object.keys(prog.p_done || {}).filter(function(k) { return prog.p_done[k]; }).length;
  // confirm()はSafariでは動くが一応メッセージ確認
  if (confirm('No.' + s.no + '　' + s.name + '\nを完了としますか？\n（撮影済み ' + shots + '枚）')) {
    let p2 = loadProgress(key) || {};
    p2.completed = true;
    p2.completed_date = todayStr();
    saveProgress(key, p2);
    // タブから削除して戻る
    openSites.splice(currentTabIdx, 1);
    if (openSites.length === 0) {
      goBack();
    } else {
      currentTabIdx = Math.min(currentTabIdx, openSites.length - 1);
      renderShootScreen();
    }
    renderSiteList(allSites);
    showToast('完了：' + s.name);
  }
}

// ===== 箇所追加 =====
let gpsStart = null;
let gpsEnd = null;

document.getElementById('add-site-btn').addEventListener('click', function() { showAddSite(); });
document.getElementById('history-btn').addEventListener('click', function() { showHistory(); });
document.getElementById('addsite-close').addEventListener('click', function() {
  document.getElementById('addsite-modal').style.display = 'none';
});
document.getElementById('addsite-modal').addEventListener('click', function(e) {
  if (e.target === document.getElementById('addsite-modal')) {
    document.getElementById('addsite-modal').style.display = 'none';
  }
});

function showAddSite() {
  ['af-name', 'af-no', 'af-start-kp', 'af-end-kp'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('gps-start-result').textContent = '未取得';
  document.getElementById('gps-start-result').className = 'gps-result';
  document.getElementById('gps-end-result').textContent = '未取得';
  document.getElementById('gps-end-result').className = 'gps-result';
  document.getElementById('af-distance-preview').textContent = '';
  gpsStart = null; gpsEnd = null;
  document.getElementById('addsite-modal').style.display = 'flex';
}

document.getElementById('gps-start-btn').addEventListener('click', function() { getGPS('start'); });
document.getElementById('gps-end-btn').addEventListener('click', function() { getGPS('end'); });

function getGPS(which) {
  const btnEl = document.getElementById('gps-' + which + '-btn');
  const resultEl = document.getElementById('gps-' + which + '-result');
  btnEl.textContent = '取得中…';
  btnEl.className = 'gps-btn loading';
  resultEl.className = 'gps-result';
  resultEl.textContent = '位置情報を取得中…';
  if (!navigator.geolocation) {
    resultEl.textContent = 'GPS非対応';
    resultEl.className = 'gps-result error';
    btnEl.textContent = '現在地を取得';
    btnEl.className = 'gps-btn';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);
      if (which === 'start') gpsStart = { lat: lat, lon: lon };
      else gpsEnd = { lat: lat, lon: lon };
      resultEl.textContent = lat.toFixed(6) + ', ' + lon.toFixed(6) + '（精度±' + acc + 'm）';
      resultEl.className = 'gps-result';
      btnEl.textContent = '再取得';
      btnEl.className = 'gps-btn';
      updateDistancePreview();
    },
    function(err) {
      const msgs = { 1: '位置情報の許可が必要です', 2: '位置情報を取得できません', 3: 'タイムアウト' };
      resultEl.textContent = msgs[err.code] || 'エラー';
      resultEl.className = 'gps-result error';
      btnEl.textContent = '現在地を取得';
      btnEl.className = 'gps-btn';
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

document.addEventListener('input', function(e) {
  if (e.target.id === 'af-start-kp' || e.target.id === 'af-end-kp') updateDistancePreview();
});

function updateDistancePreview() {
  const s = parseFloat(document.getElementById('af-start-kp').value);
  const en = parseFloat(document.getElementById('af-end-kp').value);
  const el = document.getElementById('af-distance-preview');
  if (!isNaN(s) && !isNaN(en) && en > s) {
    el.textContent = '区間距離：' + Math.round((en - s) * 1000) + ' m';
  } else {
    el.textContent = '';
  }
}

document.getElementById('add-submit-btn').addEventListener('click', function() { submitAddSite(); });

function submitAddSite() {
  const name = document.getElementById('af-name').value.trim();
  const no = document.getElementById('af-no').value.trim();
  const kanai = document.getElementById('af-kanai').value;
  const direction = document.getElementById('af-direction').value;
  const startKp = parseFloat(document.getElementById('af-start-kp').value) || null;
  const endKp = parseFloat(document.getElementById('af-end-kp').value) || null;
  if (!name || !no) { alert('箇所名とNo.は必須です'); return; }
  if (allSites.find(function(s) { return s.no === no && s.kanai === kanai; })) {
    alert(kanai + ' に No.' + no + ' はすでに存在します'); return;
  }
  const distM = (startKp != null && endKp != null && endKp > startKp) ? Math.round((endKp - startKp) * 1000) : null;
  const newSite = {
    no: no, name: name, kanai: kanai, type: '新規', direction: direction,
    start_kp: startKp, end_kp: endKp, distance_m: distM,
    gps_start: gpsStart || null, gps_end: gpsEnd || null, user_added: true
  };
  allSites.push(newSite);
  saveUserSites();
  document.getElementById('addsite-modal').style.display = 'none';
  renderKanaiFilter();
  renderSiteList(allSites);
  showToast('追加：' + no + ' ' + name);
}

function saveUserSites() {
  const added = allSites.filter(function(s) { return s.user_added; });
  try { localStorage.setItem('user_added_sites', JSON.stringify(added)); } catch(e) {}
}

function loadUserSites() {
  try {
    const v = localStorage.getItem('user_added_sites');
    return v ? JSON.parse(v) : [];
  } catch(e) { return []; }
}

// ===== 日付ヘルパー =====
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDate(str) {
  if (!str) return '日付不明';
  const parts = str.split('-');
  return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
}

// ===== 完了履歴 =====
document.getElementById('history-close').addEventListener('click', function() {
  document.getElementById('history-modal').style.display = 'none';
});
document.getElementById('history-modal').addEventListener('click', function(e) {
  if (e.target === document.getElementById('history-modal')) {
    document.getElementById('history-modal').style.display = 'none';
  }
});

function showHistory() {
  const byDate = {};
  allSites.forEach(function(s) {
    const key = s.no + '_' + s.kanai;
    const prog = loadProgress(key);
    if (!prog || !prog.completed) return;
    const date = prog.completed_date || '日付なし';
    if (!byDate[date]) byDate[date] = [];
    const shots = s.type === '新規'
      ? (prog.shinki_count || 0)
      : Object.keys(prog.p_done || {}).filter(function(k) { return prog.p_done[k]; }).length;
    byDate[date].push({ s: s, shots: shots });
  });
  const dates = Object.keys(byDate).sort().reverse();
  let html = '';
  if (dates.length === 0) {
    html = '<div class="hist-empty">完了した箇所はまだありません</div>';
  } else {
    dates.forEach(function(date) {
      const items = byDate[date];
      const totalShots = items.reduce(function(a, b) { return a + b.shots; }, 0);
      html += '<div class="hist-day"><span>' + formatDate(date) + '</span><span class="hist-count">' + items.length + '箇所・計' + totalShots + '枚</span></div>';
      items.forEach(function(item) {
        const s = item.s;
        const noClass = s.type === '新規' ? 'hist-no shinki' : 'hist-no';
        const encKey = encodeURIComponent(s.no + '|||' + s.kanai);
        html += '<div class="hist-item">'
          + '<span class="' + noClass + '">' + s.no + '</span>'
          + '<span class="hist-name">' + s.name + '</span>'
          + '<span class="hist-shots">📷 ' + item.shots + '枚</span>'
          + '<button class="hist-undo-btn" data-undo-key="' + encKey + '">解除</button>'
          + '</div>';
      });
    });
  }
  document.getElementById('history-body').innerHTML = html;
  document.getElementById('history-modal').style.display = 'flex';
}

document.getElementById('history-body').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-undo-key]');
  if (!btn) return;
  const decoded = decodeURIComponent(btn.dataset.undoKey);
  const parts = decoded.split('|||');
  const key = parts[0] + '_' + parts[1];
  const prog = loadProgress(key);
  if (!prog) return;
  delete prog.completed;
  delete prog.completed_date;
  saveProgress(key, prog);
  showHistory();
  renderSiteList(allSites);
});

// ===== 戻る =====
document.getElementById('back-btn').addEventListener('click', function() { goBack(); });

function goBack() {
  openSites = [];
  currentTabIdx = 0;
  document.getElementById('shoot-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  renderSiteList(allSites);
}

// ===== トースト =====
function showToast(msg) {
  const t = document.getElementById('fn-toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ===== localStorage =====
function saveProgress(key, data) {
  try { localStorage.setItem('prog_' + key, JSON.stringify(data)); } catch(e) {}
}
function loadProgress(key) {
  try {
    const v = localStorage.getItem('prog_' + key);
    return v ? JSON.parse(v) : null;
  } catch(e) { return null; }
}

init();
